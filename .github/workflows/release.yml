name: Release Demonstration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-demonstration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    name: Build release candidate (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Run unit and component tests
        run: npm run test

      - name: Build release candidate locally
        run: npm run build

      - name: Record showcase-only result
        run: |
          {
            echo "## Release demonstration"
            echo
            echo "The release candidate was built and verified inside the GitHub runner."
            echo
            echo "- No cloud credentials were requested."
            echo "- No staging or production environment was contacted."
            echo "- No deployment was performed."
            echo "- No build artifact was uploaded or retained."
          } >> "$GITHUB_STEP_SUMMARY"
