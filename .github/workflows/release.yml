# main的发布入口
name: Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # 发布流程开始后，不让后续提交自动取消正在进行的发布

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security:
    name: Security
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
