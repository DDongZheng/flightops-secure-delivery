name: Production Smoke Test

on:
  schedule:
    - cron: '23 7 * * *'

  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Create a controlled monitoring failure for validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      APP_URL: https://main.d2lh4ktwzmstsc.amplifyapp.com/
      INCIDENT_TITLE: '[Operational Monitor] Production availability failure'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check production endpoint and application shell
        id: production-check
        continue-on-error: true
        env:
          SIMULATE_FAILURE: ${{ github.event.inputs.simulate_failure }}
        run: |
          set -o pipefail

          {
            echo "Production availability check"
            echo "Checked URL: $APP_URL"
            echo "Checked at: $(date --utc +'%Y-%m-%dT%H:%M:%SZ')"

            if [[ "$SIMULATE_FAILURE" == "true" ]]; then
              echo "Controlled failure requested through workflow_dispatch."
              exit 1
            fi

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 10 \
              --max-time 30 \
              --dump-header response-headers.txt \
              "$APP_URL" \
              --output production.html

            grep --quiet 'id="root"' production.html
            grep --quiet '/assets/' production.html

            echo "Production endpoint is reachable."
            echo "Application shell and frontend assets were detected."
          } 2>&1 | tee smoke-test.log

      - name: Upload failure evidence
        if: always() && steps.production-check.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: production-smoke-test-failure-${{ github.run_id }}
          path: |
            production.html
            response-headers.txt
            smoke-test.log
          retention-days: 3
          if-no-files-found: warn

      - name: Find open operational incident
        id: incident
        if: always()
        run: |
          issue_number="$(
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" |
              jq \
                --raw-output \
                --arg title "$INCIDENT_TITLE" \
                '.[] |
                  select(
                    (has("pull_request") | not) and
                    .title == $title
                  ) |
                  .number' |
              sed -n '1p'
          )"

          echo "number=$issue_number" >> "$GITHUB_OUTPUT"

          if [[ -n "$issue_number" ]]; then
            echo "Found open operational incident #$issue_number."
          else
            echo "No open operational incident was found."
          fi

      - name: Create or update operational incident
        if: always() && steps.production-check.outcome == 'failure'
        env:
          ISSUE_NUMBER: ${{ steps.incident.outputs.number }}
          SIMULATE_FAILURE: ${{ github.event.inputs.simulate_failure }}
        run: |
          checked_at="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "The automated Production availability check failed."
            echo
            echo "- Checked URL: \`$APP_URL\`"
            echo "- Checked at: \`$checked_at\`"
            echo "- Workflow event: \`$GITHUB_EVENT_NAME\`"
            echo "- Controlled simulation: \`${SIMULATE_FAILURE:-false}\`"
            echo "- Workflow run: $run_url"
            echo
            echo "Follow \`OPERATIONS_RUNBOOK.md\` to investigate and recover the service."
          } > incident-update.md

          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -F body=@incident-update.md \
              > /dev/null

            echo "Updated operational incident #$ISSUE_NUMBER."
          else
            issue_url="$(
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/issues" \
                -f title="$INCIDENT_TITLE" \
                -F body=@incident-update.md \
                --jq '.html_url'
            )"

            echo "Created operational incident: $issue_url"
          fi

      - name: Close recovered operational incident
        if: >-
          always() &&
          steps.production-check.outcome == 'success' &&
          steps.incident.outputs.number != ''
        env:
          ISSUE_NUMBER: ${{ steps.incident.outputs.number }}
        run: |
          checked_at="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "Production availability has recovered."
            echo
            echo "- Verified URL: \`$APP_URL\`"
            echo "- Verified at: \`$checked_at\`"
            echo "- Workflow run: $run_url"
          } > recovery-update.md

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@recovery-update.md \
            > /dev/null

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f state=closed \
            > /dev/null

          echo "Closed recovered operational incident #$ISSUE_NUMBER."

      - name: Fail workflow when production check failed
        if: always() && steps.production-check.outcome == 'failure'
        run: |
          echo "Production availability check failed."
          exit 1
