sonar.organization=ddongzheng
sonar.projectKey=DDongZheng_flightops-secure-delivery
sonar.projectName=FlightOps Secure Delivery

sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src

sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

sonar.coverage.exclusions=src/main.tsx,src/data/**,src/types/**,src/**/*.d.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
